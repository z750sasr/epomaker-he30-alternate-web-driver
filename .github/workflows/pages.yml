name: Publish HE30 driver

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: python3 scripts/build-pages.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/he30-pages"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/he30-pages
      - name: Deploy Pages
        id: pages
        uses: actions/deploy-pages@v4
