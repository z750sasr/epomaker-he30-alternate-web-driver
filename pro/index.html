<!doctype html>
<html lang="en" data-edition="reloaded">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HE30 Pro</title>
<link rel="stylesheet" href="ae64-base.css">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="ae64-reloaded.css">
<link rel="stylesheet" href="pro.css">
</head>
<body>
<section class="workspace" id="workspace" aria-label="HE30 Pro configuration">
    <div id="sideNav" class="reloaded-navigation">
      <nav class="tool-rail" aria-label="Workspace tools">
        <button id="backHomeButton" class="rail-brand" type="button" aria-label="Welcome" title="Welcome">HE</button>
        <button type="button" data-page="performance" data-view="quick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h1m4 0h1m4 0h1M6 12h1m4 0h1m4 0h1M8 15h8"/></svg><b>Keyboard</b></button><button type="button" data-page="settings" data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8 3 3M19 5l-3 3m-8 8-3 3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><b>Settings</b></button><button type="button" data-page="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 4 3c-1 .5-1 1-1 2m0 3h.01"/></svg><b>Help</b></button>
      </nav>
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Keyboard Configuration</h2>
          <button id="toggleSidebar" class="sidebar-collapse" type="button" aria-label="Collapse sidebar" aria-expanded="true" aria-controls="keyboardNavigation" data-keyboard-input="allow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m8-11-3 3 3 3"/></svg>
          </button>
        </div>
        <div class="device-title">
          <span class="device-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h1m4 0h1m4 0h1M6 12h1m4 0h1m4 0h1M8 15h8"/></svg></span>
          <div><small id="connectionLabel">Offline workspace</small><strong>Epomaker HE30</strong></div>
        </div>
        <nav id="keyboardNavigation" aria-label="Keyboard configuration">
          <p>Profiles</p>
          <button type="button" data-page="performance" data-view="quick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h1m4 0h1m4 0h1M6 12h1m4 0h1m4 0h1M8 15h8"/></svg><b>Quick Settings</b></button><button type="button" data-page="settings" data-view="profiles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 17h7m-3.5-3.5v7"/></svg><b>My Profiles</b></button>
          <p>Keyboard Configuration</p>
          <button type="button" data-page="performance" data-view="actuation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14M5 21h14m-7-16v14m-3-11 3-3 3 3m-6 8 3 3 3-3"/></svg><b>Actuation Point</b></button>
          <button type="button" data-page="performance" data-view="rapid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5v9a3 3 0 0 0 6 0V9a3 3 0 0 1 6 0v10m-3-3 3 3 3-3M2 8l3-3 3 3"/></svg><b>Rapid Trigger</b></button>
          <button type="button" data-page="lighting"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18h18M6 14h12M12 2v5M5 6l3 3m11-3-3 3"/></svg><b>RGB Settings</b></button>
          <button type="button" data-page="keymap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h1m4 0h1m4 0h1M6 12h1m4 0h1m4 0h1M8 15h8"/></svg><b>Remap</b></button>
          <button type="button" data-page="advanced"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 16l4-8 4 8m-6-3h4"/></svg><b>Advanced Keys</b></button>
          <button type="button" data-page="gamepad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 6h10c3 0 4 3 5 8l.4 2.2c.4 2-1.7 3.3-3.1 2l-3.3-3.2H8l-3.3 3.2c-1.4 1.3-3.5 0-3.1-2L2 14c1-5 2-8 5-8Z"/><path d="M6 10v4m-2-2h4m8 0h.01m3-2h.01"/></svg><b>Gamepad</b></button>
          <button type="button" data-page="performance" data-view="switches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8 3 3M19 5l-3 3m-8 8-3 3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><b>Magnetic Switches</b></button>
          <p>Device tools</p>
          <button type="button" data-page="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h1m4 0h1m4 0h1M6 12h1m4 0h1m4 0h1M8 15h8"/></svg><b>Device Overview</b></button><button type="button" data-page="firmware"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/></svg><b>Firmware</b></button><button type="button" data-page="diagnostics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h4l3-8 5 16 3-8h5"/></svg><b>Diagnostics</b></button>
        </nav>
        <section class="sidebar-controls sidebar-preferences" aria-label="Language and appearance">
          
          <label><span>Theme</span><select id="sidebarThemeSelect"><option value="dark">Dark</option><option value="light">Light</option><option value="mint">Mint</option></select></label>
        </section>
        <a class="classic-link" href="../">Stock driver ↗</a>
      </aside>
    </div>

<div class="work-area">
 <div class="work-chrome">
  <header class="work-header">
   <div class="profile-toolbar"><select id="activeProfile" aria-label="Onboard profile"></select><button class="button ghost small" id="rename">Rename</button></div>
   <div class="header-actions"><button class="button ghost" id="connect">Connect</button><button class="button primary" id="save" disabled>Save changes</button></div>
  </header>
  <div class="pro-content">
   <p id="status" role="status">Connect H3K09 or explore the offline workspace.</p>
   <div id="pageTitle"></div>
   <div id="board" class="panel"></div>
   <section id="editor" class="panel"></section>
   <datalist id="keyCodes"></datalist>
  </div>
 </div>
</div>
</section>
<script type="module" src="app.mjs"></script>
</body>
</html>
